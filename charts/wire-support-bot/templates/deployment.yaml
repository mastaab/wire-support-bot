{{- /*
Exactly one pod: two SDK instances must never use the same store, and offers live in memory.
Recreate stops the old pod before the new one starts. The process exits within 5 seconds of
SIGTERM. A failing start exits with code 1 and Kubernetes restarts the pod. With metrics.enabled
the bot serves /metrics and /healthz on the port named metrics, set here rather than in the
ConfigMap since the port, the probe and the Service all follow metrics.port; /healthz is the
liveness probe. There is no readiness probe: nothing routes traffic to the pod. The entrypoint
builds DATABASE_URL (from the database settings in env) and runs the database migrations before
the bot starts.
*/}}
{{- $metrics := .Values.metrics }}
{{- $readOnlyRoot := dig "readOnlyRootFilesystem" false (.Values.securityContext | default dict) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wire-support-bot.fullname" . }}
  labels:
    {{- include "wire-support-bot.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "wire-support-bot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if and $metrics.enabled $metrics.podAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ include "wire-support-bot.envValue" $metrics.port }}
        prometheus.io/path: /metrics
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "wire-support-bot.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wire-support-bot.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "wire-support-bot.fullname" . }}
            - secretRef:
                name: {{ include "wire-support-bot.secretName" . }}
          {{- /* env overrides envFrom: the database settings, then extraEnv. */}}
          env:
            {{- include "wire-support-bot.databaseEnv" . | trim | nindent 12 }}
            {{- if $metrics.enabled }}
            - name: WIRE_SUPPORT_BOT_METRICS_PORT
              value: {{ include "wire-support-bot.envValue" $metrics.port }}
            - name: WIRE_SUPPORT_BOT_METRICS_HOST
              value: "0.0.0.0"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if $metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ int $metrics.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            {{- toYaml $metrics.livenessProbe | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: storage
              mountPath: /app/storage
            {{- if $readOnlyRoot }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "wire-support-bot.claimName" . }}
        {{- if $readOnlyRoot }}
        - name: tmp
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
