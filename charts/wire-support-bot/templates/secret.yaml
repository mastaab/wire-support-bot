{{- /*
Credentials, only when no existingSecret is named. Empty optional keys are left out.
*/}}
{{- if not .Values.existingSecret }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wire-support-bot.fullname" . }}
  labels:
    {{- include "wire-support-bot.labels" . | nindent 4 }}
type: Opaque
data:
  WIRE_SDK_API_TOKEN: {{ required "secrets.wireApiToken is required unless existingSecret is set: the app token from the registration" $s.wireApiToken | b64enc | quote }}
  WIRE_SDK_CRYPTO_KEY: {{ required "secrets.wireCryptoKey is required unless existingSecret is set: 64 hex characters (openssl rand -hex 32)" $s.wireCryptoKey | b64enc | quote }}
  DATABASE_URL: {{ required "secrets.databaseUrl is required unless existingSecret is set: the Postgres connection URL" $s.databaseUrl | b64enc | quote }}
  WIRE_SUPPORT_BOT_JIRA_API_TOKEN: {{ required "secrets.jiraApiToken is required unless existingSecret is set: the Jira API token" $s.jiraApiToken | b64enc | quote }}
  {{- with $s.jiraEmail }}
  WIRE_SUPPORT_BOT_JIRA_EMAIL: {{ . | b64enc | quote }}
  {{- end }}
  {{- with $s.llmApiKey }}
  WIRE_SUPPORT_BOT_LLM_API_KEY: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
