# Wire Support Bot chart values. The bot runs as exactly one pod: two instances must never share
# the SDK store, and offers live in memory. It has no inbound traffic, so there is no Service
# unless metrics are enabled (metrics.enabled), for scraping.

# Overrides the chart name in resource names and labels.
nameOverride: ""
# Overrides the full resource name (release name plus chart name).
fullnameOverride: ""

image:
  # Container image built from this repository's Dockerfile.
  repository: quay.io/wire/wire-support-bot
  # Image tag; empty: the chart's appVersion.
  tag: ""
  # Image pull policy.
  pullPolicy: IfNotPresent

# Secrets for pulling the image from a private registry, for example [{name: my-registry}].
imagePullSecrets: []

serviceAccount:
  # Whether the chart creates a service account for the pod (its token is never mounted).
  create: true
  # Name of the service account; empty: the full name when created, "default" otherwise.
  name: ""

# Extra annotations on the pod.
podAnnotations: {}
# Extra labels on the pod.
podLabels: {}

# Pod security context. User and group 1000 are the node user of the base image; fsGroup makes the
# store volume writable for it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container security context. With readOnlyRootFilesystem true an emptyDir is mounted at /tmp; the
# default is false because Prisma and the Wire SDK are not verified with a read-only root.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# Container resources; empty: none set. Example:
#   requests:
#     cpu: 100m
#     memory: 256Mi
#   limits:
#     memory: 512Mi
resources: {}

# Node selector for the pod.
nodeSelector: {}
# Tolerations for the pod.
tolerations: []
# Affinity rules for the pod.
affinity: {}

# Extra environment variables for the container, as a list of Kubernetes EnvVar objects. They come
# after the database variables, so an entry here overrides one of them.
extraEnv: []

# Extra volumes for the pod, as a list of Kubernetes Volume objects, for example a Secret with the
# database's CA certificate: [{name: postgres-ca, secret: {secretName: postgres-ca}}], or a
# ConfigMap with documents for the knowledge ingestion: [{name: knowledge, configMap: {name: support-knowledge}}].
extraVolumes: []
# Extra volume mounts for the bot's container, as a list of Kubernetes VolumeMount objects, for
# example [{name: postgres-ca, mountPath: /etc/postgres-ca, readOnly: true}] for a CA file named in
# database.options (sslcert=/etc/postgres-ca/ca.crt), or [{name: knowledge, mountPath: /knowledge, readOnly: true}].
extraVolumeMounts: []
# Extra containers in the pod, as a list of Kubernetes Container objects, for example the Cloud SQL
# Auth Proxy as a sidecar (then database.host.value is 127.0.0.1).
extraContainers: []

# Postgres connection, from the Secrets a managed database or an operator provides. Exactly one mode:
#   A. a complete URL from a key of a Secret, when url.secretName is set;
#   B. otherwise the parts: each of host, port, name and user is a plain value, or a key of the
#      Secret secretName when its secretKey is set; the password is always a key of that Secret.
# The container's entry point builds the URL from the parts and appends options. The Secrets must
# be in the release's namespace.
database:
  url:
    # Mode A: name of the Secret holding the complete URL, for example the CloudNativePG Secret
    # <cluster>-app or the Crunchy PGO Secret <cluster>-pguser-<user>. Empty: mode B.
    secretName: ""
    # Key of the URL in that Secret; uri for CloudNativePG and Crunchy PGO.
    secretKey: uri
  # Mode B: name of the Secret holding the password and every part that names a secretKey, for
  # example <cluster>-app (CloudNativePG) or <user>.<cluster>.credentials.postgresql.acid.zalan.do (Zalando).
  secretName: ""
  host:
    # Host name or IP address of the Postgres server, for example postgres.example.com or the
    # cluster's Service name; ignored when secretKey is set.
    value: ""
    # Key of the host in the Secret, for example host (CloudNativePG, Crunchy PGO); empty: value.
    secretKey: ""
  port:
    # Port of the Postgres server; ignored when secretKey is set.
    value: 5432
    # Key of the port in the Secret, for example port (CloudNativePG, Crunchy PGO); empty: value.
    secretKey: ""
  name:
    # Name of the database; ignored when secretKey is set.
    value: wire_support_bot
    # Key of the database name in the Secret, for example dbname (CloudNativePG, Crunchy PGO); empty: value.
    secretKey: ""
  user:
    # Database user; ignored when secretKey is set.
    value: wirebot
    # Key of the user in the Secret, for example username (CloudNativePG, Zalando) or user (Crunchy PGO); empty: value.
    secretKey: ""
  password:
    # Key of the password in the Secret, password for CloudNativePG, Crunchy PGO and Zalando. There is
    # no plain value: the password always comes from a Secret.
    secretKey: password
  # Query parameters appended to the URL in both modes, for example sslmode=require, or
  # sslmode=require&sslcert=/etc/postgres-ca/ca.crt with the server's CA certificate mounted through
  # extraVolumes and extraVolumeMounts. Empty: none.
  options: ""

# Name of an existing Secret holding WIRE_SDK_API_TOKEN, WIRE_SDK_CRYPTO_KEY and
# WIRE_SUPPORT_BOT_JIRA_API_TOKEN, optionally WIRE_SUPPORT_BOT_LLM_API_KEY,
# WIRE_SUPPORT_BOT_EMBED_API_KEY and WIRE_SUPPORT_BOT_JIRA_EMAIL. When set, the chart creates no Secret and secrets.* is ignored. The
# database credentials come from database.*.
existingSecret: ""

# Values for the Secret the chart creates when existingSecret is empty. The first three are required.
secrets:
  # App token issued by the Wire backend when the app was registered (scripts/register-app.mjs).
  wireApiToken: ""
  # 32-byte key for the SDK's local crypto store, 64 hex characters (openssl rand -hex 32). It encrypts the store: if it is lost or changed, delete the store too.
  wireCryptoKey: ""
  # API token: a scoped token (Bearer), or a classic token together with jiraEmail (Basic).
  jiraApiToken: ""
  # Account e-mail for a classic token; leave empty for a scoped token.
  jiraEmail: ""
  # API key for the model endpoint; Ollama ignores it, so it may stay empty there.
  llmApiKey: ""
  # API key for the embeddings endpoint (config.embedBaseUrl); empty: none is sent (it never falls back to llmApiKey).
  embedApiKey: ""

# Non-secret settings, rendered into a ConfigMap. An empty value (or null) is left out, so the app's
# own default applies. on/off settings are strings: quote them, since YAML reads a bare on as true.
config:
  # ── Wire app ──
  # Base URL of the Wire backend the app is registered on, for example https://wire-backend.example.com. Required.
  wireApiHost: ""
  # The app's user ID on the Wire backend; checked at start-up. Required.
  wireAppId: ""
  # The app's domain on the Wire backend, for example wire.example.com; checked at start-up. Required.
  wireAppDomain: ""
  # Minutes without a Wire connection before the bot restarts the connection, and as many again before it exits for a restart (0: off, else 2 to 60).
  wireWatchdogMinutes: 5

  # ── Model endpoint and slots ──
  # OpenAI-compatible chat-completions endpoint; the default is a local Ollama, which inside a pod
  # means the pod itself, so point this at a reachable endpoint such as http://ollama.example.svc:11434/v1.
  llmBaseUrl: "http://localhost:11434/v1"
  # Timeout per model call in milliseconds.
  llmTimeoutMs: 60000
  # Sent as reasoning_effort (none, low, medium or high); local thinking models such as Qwen under Ollama need none. Empty: not sent.
  llmReasoningEffort: "none"
  # Model for classifying messages for passive help and for the support triage.
  modelClassify: "qwen3-next:80b"
  # Model used when the classify model fails.
  fallbackClassify: "qwen3-next:80b"
  # Model for answers to questions addressed to the bot.
  modelRespond: "qwen3-next:80b"
  # Model used when the respond model fails.
  fallbackRespond: "qwen3-next:80b"

  # ── Document index for first-level help ──
  # Whether answers search the ingested documents (on or off); ingest them with
  # kubectl exec deploy/<release> -- node dist/app/knowledgeIngest.js <directory>.
  knowledge: "off"
  # OpenAI-compatible endpoint for embeddings, required with knowledge on (it never falls back to llmBaseUrl), for example
  # http://ollama.example.svc:11434/v1 or https://api.voyageai.com/v1. The documents and the members' questions are sent to it.
  embedBaseUrl: ""
  # Embedding model, required with knowledge on, for example qwen3-embedding:0.6b or voyage-4; the ingestion and the bot must use the same one.
  embedModel: ""
  # Most document excerpts passed to the answer model per question (1 to 10).
  knowledgeResults: 4
  # Lowest cosine similarity (0 to 1) of an excerpt passed to the answer model.
  knowledgeMinScore: 0.5

  # ── Jira (required) ──
  # REST base URL; for a scoped service-account token https://api.atlassian.com/ex/jira/<cloud id>. Required.
  jiraBaseUrl: ""
  # Site URL for links to tickets, for example https://example.atlassian.net. Required.
  jiraSiteUrl: ""
  # Where ticket links point: agent (the agent view, <site>/browse/<key>) or portal (the request in the service desk's customer portal). Keep agent for now: the bot raises requests as its own Jira account, so members cannot see them in the portal yet.
  jiraLinks: "agent"
  # Key of the Jira Service Management project, for example DESK. Required.
  jiraProjectKey: ""
  # Numeric ID of the service desk, for example "1". Required.
  jiraServiceDeskId: ""
  # Request type ID per request kind (question, part, fault), for example question=10001,part=10002,fault=10003; fault is required and used for any kind without its own. Required.
  jiraRequestTypes: ""
  # Timeout per Jira call in milliseconds (a positive whole number; raised to 1000 if lower).
  jiraTimeoutMs: 15000
  # Whether live ticket status, SLAs and desk replies may reach the answer model (on or off); with a remote model this sends ticket content to it.
  jiraShareWithModel: "off"
  # What the service desk handles, in plain words, for the model prompts (at most 500 characters); generic wording when empty.
  jiraServiceScope: ""
  # Desk agents who get a direct Wire conversation with the requester when assigned: <jira account id>=<wire handle>, comma-separated; needs the watch.
  jiraAgents: ""
  # What a newly assigned mapped agent gets: ask (ask the requester first), auto (open the direct conversation at once) or off.
  jiraAgentChat: "ask"

  # ── Part orders ──
  # Label of the item a part is for, shown in confirmations and tickets (at most 40 characters).
  partAssetLabel: "Asset"
  # How the bot asks for that item, completing "To order it I need ..." (at most 200 characters).
  partAssetQuestion: "the item the part is for (for example a machine, vehicle or device)"
  # Delivery locations offered as buttons, plus [Other]: up to 5, separated by ";", each one line of at most 40 characters; empty: the location is asked in text.
  partDeliveryLocations: ""

  # ── Passive help and watch ──
  # Whether the bot reads unaddressed messages and offers to raise, add to or resolve requests (on or off).
  jiraPassive: "off"
  # Seconds between checks of open requests for desk replies, status and assignee changes (at least 15); null: no watch.
  jiraWatchSeconds: 30
  # Hours the requester can answer the question after a desk reply or resolve (0 to 72, 0: none); null: 4.
  jiraUpdateQuestionHours: null
  # Whether the requester is asked for a 1 to 5 rating after answering [Solved], sent to the request's feedback in Jira (on or off).
  jiraFeedback: "off"

  # ── Logging and channels ──
  # Log level: debug, info, warn or error.
  logLevel: "info"
  # Log line format: json (level, msg, time) or ecs (Elastic Common Schema); both add severity.
  logFormat: "json"
  # Wire SDK log level, independent of logLevel: off, error, warn, info or debug.
  sdkLogLevel: "warn"
  # What Wire SDK log lines carry: messages (the SDK's message text, which holds IDs and backend error texts but no message content; the default), none (content-free fields only) or full (also its arguments, which may contain decrypted messages and HTTP bodies; for short troubleshooting only).
  sdkLogContent: "messages"
  # Recent messages kept in memory per conversation as context (a positive whole number, capped at 500).
  messageBufferSize: 50
  # Timezone for conversations the bot newly joins (an IANA name); members can change it per conversation.
  defaultTimezone: "UTC"

# Persistent volume for the Wire SDK store (SQLite database and CoreCrypto keystore) at /app/storage.
# Without it the bot starts as a new device and cannot read messages sent while it had no store.
# If WIRE_SDK_CRYPTO_KEY is lost or changed, delete the volume's contents too.
persistence:
  # Name of an existing PersistentVolumeClaim to use; when set, the chart creates no claim.
  existingClaim: ""
  # Size of the claim the chart creates.
  size: 1Gi
  # Storage class of the claim the chart creates; empty: the cluster default.
  storageClass: ""

# Prometheus metrics and the liveness probe. When enabled, the bot serves GET /metrics and GET
# /healthz on metrics.port (WIRE_SUPPORT_BOT_METRICS_PORT, on every interface), and the chart adds a
# ClusterIP Service for that port and a liveness probe on /healthz. The probe only checks that the
# process answers, never Wire, Jira, the model or the database, so a lost connection to one of them
# does not restart the pod. Metrics carry no message content and no conversation, user or ticket IDs.
metrics:
  # Whether the metrics and health endpoint, its Service and the liveness probe are added.
  enabled: false
  # Port of the endpoint in the container and of the Service.
  port: 9464
  # Liveness probe on /healthz. The endpoint starts before the bot connects to Wire, so the initial
  # delay only has to cover the database migrations at start-up.
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  # Adds the annotations prometheus.io/scrape, prometheus.io/port and prometheus.io/path to the pod,
  # for a Prometheus that discovers pods by them.
  podAnnotations: false
  serviceMonitor:
    # Whether a ServiceMonitor (monitoring.coreos.com/v1) is created for the Prometheus Operator; its
    # CustomResourceDefinition must be installed.
    enabled: false
    # Scrape interval.
    interval: 30s
    # Scrape timeout; at most the interval.
    scrapeTimeout: 10s
    # Extra labels on the ServiceMonitor, for example the label your Prometheus selects
    # ServiceMonitors by: {release: prometheus}.
    labels: {}
